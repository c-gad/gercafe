<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#3B1F0D"/>
  <title>GerCafe — Commander</title>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, set, get, onValue }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ════════════════════════════════════════
    //  🔥 REMPLACE PAR TA CONFIG FIREBASE
    // ════════════════════════════════════════
    const firebaseConfig = {
      apiKey:            "AIzaSyCW7p8-mXaAcMBkXTTEFKHbay_lzI8tL18",
      authDomain:        "gercafe-hmfr.firebaseapp.com",
      databaseURL:       "https://gercafe-hmfr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "gercafe-hmfr",
      storageBucket:     "gercafe-hmfr.firebasestorage.app",
      messagingSenderId: "791896470488",
      appId:             "1:791896470488:web:6442b5a16ffbefe7b1b8ad"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    // ─── Numéro de table depuis l'URL ───
    const params      = new URLSearchParams(window.location.search);
    const numeroTable = parseInt(params.get('table')) || 1;

    let panier = {};          // { produitId: { nom, prix, qte } }
    let produitsTous = {};    // catalog complet depuis Firebase

    // ════════════════════════════════════════
    //  INIT
    // ════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('numTable').textContent = numeroTable;
      chargerProduits();
    });

    // ════════════════════════════════════════
    //  CHARGER PRODUITS
    // ════════════════════════════════════════
    function chargerProduits() {
      onValue(ref(db, 'produits'), (snap) => {
        produitsTous = {};
        if (snap.exists()) {
          snap.forEach(child => {
            produitsTous[child.key] = child.val();
          });
        }
        afficherProduits();
      });
    }

    function afficherProduits() {
      const grille = document.getElementById('grilleProduits');
      const loading = document.getElementById('loadingProduits');
      loading.style.display = 'none';

      const ids = Object.keys(produitsTous);
      if (ids.length === 0) {
        grille.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">☕</div>
            <p>Aucun produit disponible</p>
          </div>`;
        return;
      }

      // Grouper par catégorie
      const categories = {};
      ids.forEach(id => {
        const p = produitsTous[id];
        const cat = p.categorie || 'Autres';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push({ id, ...p });
      });

      grille.innerHTML = '';
      Object.entries(categories).forEach(([cat, prods]) => {
        const titre = document.createElement('div');
        titre.className = 'cat-titre';
        titre.textContent = cat;
        grille.appendChild(titre);

        const row = document.createElement('div');
        row.className = 'produits-row';
        prods.forEach(p => {
          row.appendChild(creerCarteProduit(p));
        });
        grille.appendChild(row);
      });
    }

    function creerCarteProduit(p) {
      const card = document.createElement('div');
      card.className = 'produit-card';
      card.id = `card-${p.id}`;
      card.innerHTML = `
        <div class="produit-icon">${p.emoji || '🍽️'}</div>
        <div class="produit-nom">${p.nom}</div>
        <div class="produit-prix">${parseFloat(p.prix || 0).toFixed(2)} Dh</div>
        <div class="produit-actions">
          <button class="btn-moins" onclick="changerQte('${p.id}', -1)">−</button>
          <span class="produit-qte" id="qte-${p.id}">0</span>
          <button class="btn-plus" onclick="changerQte('${p.id}', 1)">+</button>
        </div>
      `;
      return card;
    }

    // ════════════════════════════════════════
    //  PANIER
    // ════════════════════════════════════════
    window.changerQte = function(id, delta) {
      const p = produitsTous[id];
      if (!p) return;

      const actuel = panier[id]?.qte || 0;
      const nvQte = Math.max(0, actuel + delta);

      if (nvQte === 0) {
        delete panier[id];
      } else {
        panier[id] = { nom: p.nom, prix: parseFloat(p.prix || 0), qte: nvQte };
      }

      // Mise à jour affichage qte sur la carte
      const qteEl = document.getElementById(`qte-${id}`);
      if (qteEl) qteEl.textContent = nvQte;

      const cardEl = document.getElementById(`card-${id}`);
      if (cardEl) cardEl.classList.toggle('selected', nvQte > 0);

      majPanier();
    };

    function majPanier() {
      const items = Object.values(panier);
      const total = items.reduce((s, i) => s + i.prix * i.qte, 0);
      const nbArticles = items.reduce((s, i) => s + i.qte, 0);

      document.getElementById('totalPanier').textContent =
        total.toFixed(2) + ' Dh';
      document.getElementById('nbArticles').textContent =
        nbArticles > 0 ? `${nbArticles} article${nbArticles > 1 ? 's' : ''}` : '';

      const btnCommander = document.getElementById('btnCommander');
      btnCommander.disabled = items.length === 0;
      btnCommander.style.opacity = items.length === 0 ? '0.5' : '1';

      // Détail panier
      const detailEl = document.getElementById('detailPanier');
      if (items.length === 0) {
        detailEl.innerHTML = '<p class="panier-vide">Votre panier est vide</p>';
      } else {
        detailEl.innerHTML = items.map(i => `
          <div class="panier-ligne">
            <span>${i.nom} × ${i.qte}</span>
            <span>${(i.prix * i.qte).toFixed(2)} Dh</span>
          </div>
        `).join('');
      }
    }

    // ════════════════════════════════════════
    //  COMMANDER
    // ════════════════════════════════════════
    window.commander = async function() {
      const items = Object.values(panier);
      if (items.length === 0) return;

      const btnCommander = document.getElementById('btnCommander');
      btnCommander.disabled = true;
      btnCommander.textContent = 'Envoi en cours…';

      try {
        const now = new Date();
        const heure = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const date  = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;

        const total = items.reduce((s, i) => s + i.prix * i.qte, 0);

        const produitsFB = {};
        Object.entries(panier).forEach(([id, val]) => {
          produitsFB[id] = { nom: val.nom, prix: val.prix, qte: val.qte };
        });

        // Enregistrer la commande
        const cmdRef = push(ref(db, 'commandes'));
        await set(cmdRef, {
          table:        numeroTable,
          produits:     produitsFB,
          total:        parseFloat(total.toFixed(2)),
          statut:       'en_attente',
          heure:        heure,
          date:         date,
          nb_personnes: 1,
        });

        // Mettre à jour le statut de la table
        await set(ref(db, `tables/${numeroTable}/statut`), 'en_attente');

        // Afficher la confirmation
        afficherConfirmation(total, heure);

      } catch (err) {
        console.error('Erreur commande:', err);
        alert('Une erreur est survenue. Veuillez réessayer.');
        btnCommander.disabled = false;
        btnCommander.textContent = '☕ Envoyer la commande';
      }
    };

    // ════════════════════════════════════════
    //  APPELER LE SERVEUR
    // ════════════════════════════════════════
    window.appelServeur = async function() {
      try {
        await set(ref(db, `tables/${numeroTable}`), {
          statut: 'appel_serveur',
          appel_serveur: true,
          serveur: 'client',
        });
        document.getElementById('msgAppel').style.display = 'flex';
        setTimeout(() => {
          document.getElementById('msgAppel').style.display = 'none';
        }, 3000);
      } catch(e) {
        console.error(e);
      }
    };

    function afficherConfirmation(total, heure) {
      document.getElementById('ecranCommande').style.display = 'none';
      const conf = document.getElementById('ecranConfirmation');
      conf.style.display = 'flex';
      document.getElementById('confTotal').textContent = total.toFixed(2) + ' Dh';
      document.getElementById('confHeure').textContent = heure;
    }

    window.nouvelleCommande = function() {
      panier = {};
      Object.keys(produitsTous).forEach(id => {
        const el = document.getElementById(`qte-${id}`);
        if (el) el.textContent = '0';
        const card = document.getElementById(`card-${id}`);
        if (card) card.classList.remove('selected');
      });
      majPanier();
      document.getElementById('ecranConfirmation').style.display = 'none';
      document.getElementById('ecranCommande').style.display = 'flex';
    };
  </script>

  <style>
    /* ════════════════════════════════════
       VARIABLES — GRAIN DE CAFÉ
    ════════════════════════════════════ */
    :root {
      --espresso:  #1C0A00;
      --arabica:   #3B1F0D;
      --robusta:   #6B3A2A;
      --moka:      #9C5C38;
      --caramel:   #C8853A;
      --latte:     #D4A96A;
      --creme:     #F0DDB8;
      --mousse:    #FAF3E8;
      --blanc:     #FFFFFF;
      --success:   #2E7D4F;
      --alert:     #D4520A;
      --danger:    #C0392B;
      --info:      #1A5F7A;
      --radius:    16px;
      --shadow:    0 4px 20px rgba(28,10,0,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--mousse);
      color: var(--arabica);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ────────────────────────────────────
       ÉCRAN COMMANDE
    ──────────────────────────────────── */
    #ecranCommande {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--espresso), var(--arabica), #4A2515);
      padding: 24px 20px 28px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '☕';
      position: absolute;
      right: 20px;
      top: 16px;
      font-size: 60px;
      opacity: 0.07;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .logo-circle {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--latte), var(--caramel));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .cafe-nom {
      font-size: 22px;
      font-weight: 800;
      color: var(--latte);
      letter-spacing: 2px;
      font-family: Georgia, serif;
    }

    .cafe-sous {
      font-size: 12px;
      color: rgba(240,221,184,0.65);
      margin-top: 2px;
    }

    .badge-table {
      background: linear-gradient(135deg, var(--caramel), var(--moka));
      color: var(--blanc);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(200,133,58,0.4);
    }

    /* Contenu scrollable */
    .content {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
    }

    /* Catégories */
    .cat-titre {
      font-size: 11px;
      font-weight: 800;
      color: var(--moka);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 20px 0 10px 4px;
    }

    .cat-titre:first-child { margin-top: 0; }

    .produits-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* Carte produit */
    .produit-card {
      background: var(--blanc);
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--creme);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .produit-card.selected {
      border-color: var(--robusta);
      background: #FDF6EE;
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(107,58,42,0.15);
    }

    .produit-icon {
      font-size: 32px;
      margin-bottom: 6px;
      line-height: 1;
    }

    .produit-nom {
      font-size: 13px;
      font-weight: 700;
      color: var(--arabica);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .produit-prix {
      font-size: 14px;
      font-weight: 800;
      color: var(--robusta);
      margin-bottom: 10px;
    }

    .produit-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-moins, .btn-plus {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-moins {
      background: var(--creme);
      color: var(--robusta);
    }

    .btn-plus {
      background: linear-gradient(135deg, var(--robusta), var(--espresso));
      color: var(--blanc);
      box-shadow: 0 3px 8px rgba(107,58,42,0.35);
    }

    .btn-moins:active { transform: scale(0.9); }
    .btn-plus:active  { transform: scale(0.9); }

    .produit-qte {
      font-size: 16px;
      font-weight: 800;
      color: var(--arabica);
      min-width: 20px;
    }

    /* Loading */
    #loadingProduits {
      text-align: center;
      padding: 60px 0;
      color: var(--moka);
      font-size: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--creme);
      border-top-color: var(--robusta);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--moka);
    }

    .empty-icon { font-size: 56px; margin-bottom: 12px; }

    /* ────────────────────────────────────
       BARRE BASSE — PANIER
    ──────────────────────────────────── */
    .barre-panier {
      background: var(--blanc);
      border-top: 1.5px solid var(--creme);
      padding: 14px 16px;
      box-shadow: 0 -4px 20px rgba(28,10,0,0.08);
    }

    .panier-detail {
      margin-bottom: 10px;
      max-height: 80px;
      overflow-y: auto;
    }

    .panier-ligne {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--arabica);
      padding: 2px 0;
    }

    .panier-vide {
      font-size: 12px;
      color: var(--moka);
      text-align: center;
      opacity: 0.7;
      padding: 4px 0;
    }

    .panier-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panier-nb { font-size: 12px; color: var(--moka); }

    .panier-total {
      font-size: 20px;
      font-weight: 800;
      color: var(--robusta);
      font-family: Georgia, serif;
    }

    .btn-commander {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--robusta), var(--espresso));
      color: var(--creme);
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(107,58,42,0.4);
      transition: all 0.2s;
    }

    .btn-commander:active { transform: scale(0.98); }
    .btn-commander:disabled { cursor: not-allowed; }

    /* Bouton appel serveur */
    .btn-appel {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: transparent;
      color: var(--alert);
      border: 1.5px solid var(--alert);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-appel:active {
      background: var(--alert);
      color: white;
    }

    /* Message appel envoyé */
    #msgAppel {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #FFF3E0;
      border: 1px solid var(--alert);
      border-radius: 10px;
      padding: 10px 16px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--alert);
      font-weight: 600;
    }

    /* ────────────────────────────────────
       ÉCRAN CONFIRMATION
    ──────────────────────────────────── */
    #ecranConfirmation {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 24px;
      background: var(--mousse);
      text-align: center;
    }

    .conf-cercle {
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, var(--success), #1a5c35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      margin-bottom: 28px;
      box-shadow: 0 8px 28px rgba(46,125,79,0.35);
    }

    .conf-titre {
      font-size: 26px;
      font-weight: 800;
      color: var(--arabica);
      font-family: Georgia, serif;
      margin-bottom: 8px;
    }

    .conf-sous {
      font-size: 15px;
      color: var(--moka);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .conf-card {
      background: var(--blanc);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }

    .conf-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--creme);
    }

    .conf-row:last-child { border-bottom: none; }

    .conf-label {
      font-size: 13px;
      color: var(--moka);
    }

    .conf-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--arabica);
    }

    .conf-total { font-size: 22px; color: var(--robusta); }

    .btn-nouvelle {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      background: linear-gradient(135deg, var(--robusta), var(--espresso));
      color: var(--creme);
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(107,58,42,0.4);
    }

    /* Responsive tablette */
    @media (min-width: 480px) {
      .produits-row { grid-template-columns: repeat(3, 1fr); }
      .content { max-width: 520px; margin: 0 auto; }
      .barre-panier { max-width: 520px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════
       ÉCRAN COMMANDE
  ═══════════════════════════════ -->
  <div id="ecranCommande">

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="logo-circle">☕</div>
        <div>
          <div class="cafe-nom">GERCAFE</div>
          <div class="cafe-sous">Bienvenue chez nous</div>
        </div>
      </div>
      <div class="badge-table">
        🪑 Table <span id="numTable">1</span>
      </div>
    </div>

    <!-- Produits -->
    <div class="content">
      <div id="loadingProduits">
        <div class="spinner"></div>
        Chargement du menu…
      </div>
      <div id="grilleProduits"></div>
    </div>

    <!-- Barre panier -->
    <div class="barre-panier">
      <div class="panier-detail" id="detailPanier">
        <p class="panier-vide">Votre panier est vide</p>
      </div>
      <div class="panier-total-row">
        <span class="panier-nb" id="nbArticles"></span>
        <span class="panier-total" id="totalPanier">0.00 Dh</span>
      </div>
      <button class="btn-commander" id="btnCommander"
              onclick="commander()" disabled>
        ☕ Envoyer la commande
      </button>
      <button class="btn-appel" onclick="appelServeur()">
        🔔 Appeler le serveur
      </button>
      <div id="msgAppel">
        ✅ Le serveur a été appelé, il arrive !
      </div>
    </div>

  </div>

  <!-- ═══════════════════════════════
       ÉCRAN CONFIRMATION
  ═══════════════════════════════ -->
  <div id="ecranConfirmation">
    <div class="conf-cercle">✓</div>
    <div class="conf-titre">Commande envoyée !</div>
    <div class="conf-sous">
      Votre commande a bien été reçue.<br>
      Un serveur s'occupera de vous très vite.
    </div>

    <div class="conf-card">
      <div class="conf-row">
        <span class="conf-label">🪑 Table</span>
        <span class="conf-val" id="numTable2"></span>
      </div>
      <div class="conf-row">
        <span class="conf-label">🕐 Heure</span>
        <span class="conf-val" id="confHeure"></span>
      </div>
      <div class="conf-row">
        <span class="conf-label">💰 Total</span>
        <span class="conf-val conf-total" id="confTotal"></span>
      </div>
    </div>

    <button class="btn-nouvelle" onclick="nouvelleCommande()">
      ➕ Ajouter une autre commande
    </button>
  </div>

  <script>
    // Synchroniser numéro table dans écran confirmation
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const n = params.get('table') || '1';
      const el = document.getElementById('numTable2');
